[package]
name = "reposcrape"
authors = ["LeHuman"]
version = "0.1.7"
edition = "2021"
description = "Repository scraper for presenting repositories on a personal website"
repository = "https://github.com/LeHuman/reposcrape"
license = "MIT OR Apache-2.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
octocrab = "0.54.9"
tokio = { version = "1.54.1", features = ["full"] }
serde_json = "1.0.154"
chrono = "0.4.45"
regex = "1.13.1"
set_field = "0.1.1"
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_yaml = "0.9.34"
tracing = "0.1.44"
localsavefile = { version = "0.2.19" }
savefile = { version = "0.20.6", features = ["compression", "derive", "serde"] }
secrecy = "0.10.3"
show-option = "0.2.0"

[dev-dependencies]
tracing-subscriber = "0.3.23"
tracing-test = "0.2.6"
