[package]
name = "reposcrape"
authors = ["LeHuman"]
version = "0.1.6"
edition = "2021"
description = "Repository scraper for presenting repositories on a personal website"
repository = "https://github.com/LeHuman/reposcrape"
license = "MIT OR Apache-2.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
octocrab = "0.44.1"
tokio = { version = "1", features = ["full"] }
serde_json = "1.0.142"
chrono = "0.4.41"
regex = "1.11.1"
set_field = "0.1.1"
reqwest = { version = "0.12.22", features = ["json"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_yaml = "0.9.34"
tracing = "0.1.41"
localsavefile = { version = "0.2.13" }
savefile = { version = "0.19.0", features = ["compression", "derive", "serde"] }
secrecy = "0.10.3"
show-option = "0.2.0"

[dev-dependencies]
tracing-subscriber = "0.3.19"
tracing-test = "0.2.5"
